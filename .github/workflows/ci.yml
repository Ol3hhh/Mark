name: CI

on:
  push:
    branches: [main, master, "wip-*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."
        continue-on-error: true

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU version of PyTorch for fast execution without GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tensordict pytest
          pip install -e source/mark_tasks

      - name: Run unit tests (non-Isaac / non-GPU)
        run: |
          pytest -v -m "not isaac and not gpu"

  check-walk:
    name: Mark_v1 Check Motion
    needs: [lint, test]
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, isaac-gpu]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run check_motion (walk-eval gate)
        shell: bash -l {0}
        run: |
          # CONDA_SH_PATH is machine-specific and injected by the self-hosted
          # runner's own .env file (Programs/actions-runner/.env on the
          # runner host), not committed here -- so this workflow stays
          # portable if the runner ever moves/gets reinstalled elsewhere.
          source "$CONDA_SH_PATH"
          conda activate env_isaaclab
          python scripts/agent.py --task Mark-Flat-v1-Check --headless
